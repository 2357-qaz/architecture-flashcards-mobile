<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4eedc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="架构闪卡" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>架构闪卡 · Architecture Flashcards</title>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Architecture Deck</p>
        <h1>架构闪卡</h1>
        <p class="subtitle">入门到中级：边界、DDD、微服务、分布式、缓存、可观测性。</p>
      </div>
      <button class="ghost-button" id="resetBtn" title="清空本机学习进度">重置</button>
    </header>

    <section class="stats-grid" aria-label="学习统计">
      <div class="stat-card">
        <span class="stat-label">今日待复习</span>
        <strong id="dueCount">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">已掌握</span>
        <strong id="masteredCount">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">正确率</span>
        <strong id="accuracy">0%</strong>
      </div>
    </section>

    <section class="controls" aria-label="筛选题卡">
      <label>
        <span>分类</span>
        <select id="categorySelect"></select>
      </label>
      <label>
        <span>模式</span>
        <select id="modeSelect">
          <option value="due">今日待复习</option>
          <option value="all">全部题卡</option>
          <option value="hard">薄弱题卡</option>
        </select>
      </label>
      <label class="search-field">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="比如：CAP、缓存、DDD" autocomplete="off" />
      </label>
    </section>

    <main class="study-panel">
      <div class="progress-row">
        <span id="cardPosition">Card 0 of 0</span>
        <span class="pill" id="difficultyPill">入门</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div id="progressFill"></div></div>

      <article class="flashcard" id="flashcard" tabindex="0" aria-live="polite">
        <div class="card-topline">
          <span class="category-chip" id="categoryChip">架构基础</span>
          <span id="boxChip" class="box-chip">Box 1</span>
        </div>
        <p class="question-label">Question</p>
        <h2 id="questionText">加载中……</h2>
        <div class="answer-block" id="answerBlock" hidden>
          <p class="answer-label">Answer</p>
          <p id="answerText"></p>
          <p class="note" id="noteText"></p>
        </div>
        <p class="tap-hint" id="tapHint">轻点卡片显示答案；答案出现后左右滑动也可以评分。</p>
      </article>

      <div class="actions">
        <button class="secondary-action" id="missedBtn">× 没记住</button>
        <button class="primary-action" id="revealBtn">显示答案</button>
        <button class="success-action" id="gotBtn">✓ 记住了</button>
      </div>

      <div class="utility-row">
        <button id="exportBtn">导出进度</button>
        <button id="importBtn">导入进度</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </main>

    <section class="mini-guide">
      <h3>复习逻辑</h3>
      <p>答对会把卡片推到更远的复习箱，答错会回到 Box 1。这个版本用的是简化 Leitner 间隔，不装神弄鬼，不假装自己是神经科学实验室。</p>
    </section>
  </div>

  <template id="emptyTemplate">
    <div class="empty-state">
      <h2>这组卡片暂时清空了</h2>
      <p>可以切到“全部题卡”，或者换个分类继续刷。真正的架构学习就是这样：卡片清了，债还在。</p>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
