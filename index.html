<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4eedc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="架构闪卡" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>架构闪卡 · Architecture Flashcards</title>
</head>
<body>
  <div class="app-shell">
    <header class="compact-header">
      <div class="brand-block">
        <p class="eyebrow">Architecture Deck</p>
        <h1>架构闪卡</h1>
      </div>
      <div class="header-actions">
        <span class="due-badge">待复习 <strong id="dueCount">0</strong></span>
        <button class="icon-button" id="toolsBtn" type="button" aria-label="打开学习设置" aria-haspopup="dialog">设置</button>
      </div>
    </header>

    <main class="study-panel">
      <div class="progress-row">
        <span id="cardPosition">Card 0 of 0</span>
        <span class="pill" id="difficultyPill">入门</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div id="progressFill"></div></div>

      <article class="flashcard" id="flashcard" tabindex="0" aria-live="polite">
        <div class="card-topline">
          <span class="category-chip" id="categoryChip">架构基础</span>
          <span id="boxChip" class="box-chip">Box 1</span>
        </div>

        <div class="card-content">
          <p class="question-label">Question</p>
          <h2 id="questionText">加载中……</h2>
          <div class="answer-block" id="answerBlock" hidden>
            <p class="answer-label">Answer</p>
            <p id="answerText"></p>
            <p class="note" id="noteText"></p>
          </div>
        </div>

        <p class="tap-hint" id="tapHint">轻点卡片显示答案；答案出现后左右滑动也可以评分。</p>
      </article>

      <div class="actions" aria-label="闪卡操作">
        <button class="secondary-action" id="missedBtn">× 没记住</button>
        <button class="primary-action" id="revealBtn">显示答案</button>
        <button class="success-action" id="gotBtn">✓ 记住了</button>
      </div>
    </main>
  </div>

  <dialog id="toolsDialog" class="tools-dialog" aria-labelledby="toolsTitle">
    <div class="dialog-sheet">
      <header class="dialog-header">
        <div>
          <p class="eyebrow">Study Tools</p>
          <h2 id="toolsTitle">学习设置</h2>
        </div>
        <button class="dialog-close" id="closeToolsBtn" type="button">完成</button>
      </header>

      <div class="dialog-scroll">
        <section class="stats-grid" aria-label="学习统计">
          <div class="stat-card">
            <span class="stat-label">已掌握</span>
            <strong id="masteredCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">正确率</span>
            <strong id="accuracy">0%</strong>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="filterTitle">
          <h3 id="filterTitle">题卡范围</h3>
          <div class="controls" aria-label="筛选题卡">
            <label>
              <span>分类</span>
              <select id="categorySelect"></select>
            </label>
            <label>
              <span>模式</span>
              <select id="modeSelect">
                <option value="due">今日待复习</option>
                <option value="all">全部题卡</option>
                <option value="hard">薄弱题卡</option>
              </select>
            </label>
            <label class="search-field">
              <span>搜索</span>
              <input id="searchInput" type="search" placeholder="比如：CAP、缓存、DDD" autocomplete="off" />
            </label>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="dataTitle">
          <h3 id="dataTitle">学习数据</h3>
          <div class="utility-row">
            <button id="exportBtn">导出进度</button>
            <button id="importBtn">导入进度</button>
            <input id="importFile" type="file" accept="application/json" hidden />
          </div>
        </section>

        <section class="settings-section mini-guide" aria-labelledby="guideTitle">
          <h3 id="guideTitle">复习逻辑</h3>
          <p>答对会把卡片推到更远的复习箱，答错会回到 Box 1。当前使用简化 Leitner 间隔，主界面只保留与当前记忆动作直接相关的信息。</p>
        </section>

        <section class="settings-section danger-zone" aria-labelledby="resetTitle">
          <div>
            <h3 id="resetTitle">重置学习记录</h3>
            <p>清除本机保存的答题进度，不会删除题库。</p>
          </div>
          <button class="reset-button" id="resetBtn" type="button">重置进度</button>
        </section>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
  <script>
    (() => {
      const dialog = document.getElementById('toolsDialog');
      const openButton = document.getElementById('toolsBtn');
      const closeButton = document.getElementById('closeToolsBtn');

      openButton.addEventListener('click', () => {
        if (!dialog.open) dialog.showModal();
      });

      closeButton.addEventListener('click', () => dialog.close());

      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close();
      });
    })();
  </script>
</body>
</html>
